services:
  - type: web
    name: camera-casa-diamantes
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/camera-data
      - key: PUBLIC_URL
        value: https://camera-casa-diamantes.onrender.com
      - key: TZ
        value: America/Sao_Paulo
      - key: DEVICE_TOKEN
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
